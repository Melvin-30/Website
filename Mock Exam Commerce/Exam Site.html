<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mock Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --hover-color: #3b82f6;
            --text-color: #1f2937;
            --light-bg: #f9fafb;
            --shadow: 0 0.25rem 0.375rem rgba(0, 0, 0, 0.1);
            --border-radius: 0.5rem;
            --container-padding: 1rem;
            --max-width: 75rem;
            /* 1200px */
        }

        h1 {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1rem 1rem;
            box-shadow: var(--shadow);
            color: white;
            margin-bottom: 1rem;
            text-align: center;
        }

        h3 {
            border-bottom: 1px solid #ccc;
            color: var(--primary-color);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
        }

        td.Details {

            font-weight: bold;
        }

        table.Details {
            width: 100%;
            margin-left: 5%;
        }

        .time {
            display: flex;
            justify-content: right;
            margin-right: 2%;
        }
    </style>
</head>

<body>
    <header>
        <h1>DON BOSCO HIGH SCHOOL AND JUNIOR COLLEGE, OROS</h1>

        <table class="Details">
            <tr>
                <td class="Details">Seat No: P025****</td>
                <td class="Details">Index No: 111****</td>
                <td class="Details">Paper ID: MOCK_PAPER</td>
                <td class="Details">Current Time: <i id="clock"></i></td>

            </tr>
            <tr>
                <td class="Details">Subject Code: 99</td>
                <td class="Details">Batch: B*</td>
                <td class="Details">Ans File Size: *** Bytes</td>
                <td class="Details">Time Remaining: <i id="countdown">02:30:00</i></td>

            </tr>
        </table>
    </header>
    <div class="app">
        <aside class="left-nav" id="leftNav">
            <h3>Questions</h3>
            <div id="sectionsList"></div>
        </aside>

        <main class="main">
            <div class="controls">
                <button id="generateBtn">Generate Paper</button>
                <button id="submitBtn" class="ghost">Finish Exam</button>
                <button id="showAnswerBtn" class="ghost" style="display: none;">Show Answers</button>
                <div style="flex:1"></div>
                <div id="scoreSummary" style="font-weight:700;color:#333"></div>
            </div>
            <h2 id="rightSectionTitle" class="right-title"></h2>

            <div class="paper" id="paperArea">
                <!-- Questions render here -->
            </div>

            <div id="result"></div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        // Function to update the time
        function updateTime() {
            const now = new Date(); // Get the current date and time

            // Format time in 24-hour format
            const formattedTime = now.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            // Update clock
            document.getElementById('clock').textContent = formattedTime;
        }

        // Update the time immediately on page load
        updateTime();

        // Update every second
        setInterval(updateTime, 1000);


        // Update the time every second (1000 milliseconds)
        setInterval(updateTime, 1000);
        // Countdown duration: 2 hours 30 minutes (in seconds)
        let countdownTime = (2 * 60 * 60) + (30 * 60);

        function updateCountdown() {
            const hours = Math.floor(countdownTime / 3600);
            const minutes = Math.floor((countdownTime % 3600) / 60);
            const seconds = countdownTime % 60;

            document.getElementById("countdown").textContent =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");

            if (countdownTime > 0) {
                countdownTime--;
            } else {
                clearInterval(countdownInterval);
                document.getElementById("countdown").textContent = "Time's up!";
            }
        }

        // Start countdown immediately
        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);

    </script>
</body>

</html>
